; The Layonara plugin: fetch areas from Layonara's database, try them on
; the dev server, send them for review. Bundled with Moonglow's Layonara
; build (plugins/ in the fork's source).
[plugin]
id = "layonara.builders"
name = "Layonara"
version = "1.2.0"
api = "0.12"
license = "GPL-3.0-or-later"
description = "Fetch areas from Layonara's database or your Forge exports into your module, try them on the dev server and send them for review. For Layonara's builders."
author = "Layonara"

[network]
hosts = "builders.layonara.com"

[signin]
id = "layonara"
issuer = "https://auth.layonara.com/application/o/moonglow-layonara/"
client = "moonglow-layonara"
scopes = "openid profile email offline_access"

[command]
id = "sign-in"
title = "Sign In…"
hint = "Sign in with your Layonara account (once per computer)"
menu = "Layonara"

[command]
id = "new-module"
title = "New Layonara Module…"
hint = "Download Layonara's module (its blueprints, palettes and bare areas: nasher target bare) into a folder you choose, and open it"
menu = "Layonara"
new = "module"

[command]
id = "fetch"
title = "Fetch Area…"
hint = "Bring an area from Layonara's database into this module, merged with your copy if you have one"
menu = "Layonara"

[command]
id = "forge"
title = "From the Forge…"
hint = "Bring one of your Forge exports into this module: the area, its blueprints, its tile hak and your texture library"
menu = "Layonara"

[command]
id = "try"
title = "Try on Dev"
hint = "Put the selected or open areas on the dev server, unsaved edits included"
for = "area"
menu = "Layonara"

[command]
id = "submit"
title = "Send for Review…"
hint = "Send the selected or open areas to the staff's review queue"
for = "area"
menu = "Layonara"

[command]
id = "status"
title = "Trial Status"
hint = "What of yours is on the dev server, and for how long"
menu = "Layonara"

[command]
id = "release"
title = "Release…"
hint = "Put your trial areas on dev back to live's"
menu = "Layonara"

[command]
id = "sign-out"
title = "Sign Out"
hint = "Sign out of Layonara on this computer"
menu = "Layonara"

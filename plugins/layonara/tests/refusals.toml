# Refusals and network failures on every command: a message to read, no runtime error.
module = "module"
root = false

[[test]]
name = "Fetch Area: a 400 with problems lists them by area and says what to do"
command = "fetch"
signed_in = "alice"
answers = { area = "well" }
log = ["well: The area can't be published as it is.", "• area crypt: The GIT does not survive nwn_gff's round trip unchanged.", "Fix these in your copy, then try again."]
edits = 0
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area"
file = "replies/areas.json"
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area/well"
status = 400
json = { detail = "The area can't be published as it is.", items = [{ kind = "area", key = "crypt", status = 400, detail = "Not publishable.", problems = ["The GIT does not survive nwn_gff's round trip unchanged."] }] }

[[test]]
name = "Fetch Area: a 409 is a message"
command = "fetch"
signed_in = "alice"
answers = { area = "well" }
log = ["well: The area well is not live."]
edits = 0
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area"
file = "replies/areas.json"
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area/well"
status = 409
json = { detail = "The area well is not live." }

[[test]]
name = "Fetch Area: a 502 from the proxy, no JSON"
command = "fetch"
signed_in = "alice"
answers = { area = "well" }
log = ["well: Layonara's builder service answered 502", "Try again in a few minutes"]
edits = 0
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area"
file = "replies/areas.json"
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area/well"
status = 502
body = "<html><body>502 Bad Gateway</body></html>"

[[test]]
name = "Fetch Area: no connection"
command = "fetch"
signed_in = "alice"
answers = { area = "well" }
log = ["Moonglow couldn't reach Layonara's builder service (the host was not found (not connected?)).", "Check your internet connection"]
edits = 0
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area"
file = "replies/areas.json"
[[test.reply]]
method = "GET"
url = "https://builders.layonara.com/api/v1/builder/res/area/well"
fail = "the host was not found (not connected?)"


name: Release

# Builds the packages (packaging/README.md): the AppImage, the Windows
# installer and the macOS disk image. A tag v* also drafts a GitHub
# release with them; run by hand, the packages are the run's artifacts.
# The draft is signed on the owner's machine before it is published
# (packaging/sign-release.sh: SHA256SUMS and its minisign signature,
# which the app checks before installing an update); the secret key is
# never given to this workflow.
#
# A fork's build (packaging/release-source names its repository and the
# channel word of its versions, 4.2.0-layonara.1) checks the fork's
# releases, never upstream's: its tag must be v and the version
# Cargo.toml says, the channel in it, so that neither can be taken for
# the other's.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release build per ref at a time.
concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

# Caches are saved by develop (a fork's: layonara) alone (as ci.yml's):
# a tag's could only be read by that tag's runs again, and GitHub keeps
# 10 GB per repository, so each release's evicted develop's tests'
# caches.
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The version, and the tag's
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          field() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"\{0,1\}\([^\"]*\)\"\{0,1\}[[:space:]]*$/\1/p" packaging/release-source 2>/dev/null | head -n 1; }
          repo=$(field repo); channel=$(field channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Moonglow $version, releases of ${repo:-jadzziaa/moonglow-toolset}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n $repo && $repo != "$GITHUB_REPOSITORY" ]]; then
            echo "::warning::packaging/release-source names $repo, this is $GITHUB_REPOSITORY"
          fi
          if [[ -n $channel && $version != *-"$channel".* ]]; then
            echo "::error::a $channel build's version is to carry -$channel.N (4.2.0-$channel.1), not $version"
            exit 1
          fi
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version Cargo.toml says"
            exit 1
          fi

  linux:
    name: AppImage
    needs: version
    # The oldest supported Ubuntu: the image runs where glibc and libstdc++
    # are at least this new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/layonara' }}
      - name: Libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Build
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.AppImage

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    # Tags sign with Azure Artifact Signing (packaging/windows/sign.ps1),
    # signed in with GitHub's OIDC token; the release environment holds the
    # Azure ids. Other runs build unsigned, as before.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/layonara' }}
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { packaging\windows\build-installer.ps1 -Sign }
          else { packaging\windows\build-installer.ps1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dist/*-setup.exe
            target/dist/*-windows-x64.zip

  macos:
    name: macOS disk image
    needs: version
    runs-on: macos-latest
    # The Developer ID secrets live in the release environment, which only
    # v* tags may use; other runs build ad hoc signed, as before.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/layonara' }}
      - name: Signing keychain
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No Developer ID certificate: the app is signed ad hoc"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          (umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12")
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          # Lets codesign use the key without a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per line, no spaces
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # By hash: the team's Developer ID Application identity, no other.
          id=$(security find-identity -v -p codesigning "$kc" \
            | awk -v t="($TEAM_ID)\"" '/"Developer ID Application: / && index($0, t) { print $2; exit }')
          if [ -z "$id" ]; then
            echo "::error::No Developer ID Application identity for team $TEAM_ID"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build
        run: packaging/macos/build-app.sh
      - name: Notarize
        if: env.CODESIGN_IDENTITY != ''
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg=$(ls target/dist/*.dmg)
          key="$RUNNER_TEMP/notary.p8"
          (umask 077; printf '%s\n' "$NOTARY_KEY" > "$key")
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 1h \
            --output-format json > notary.json || true
          cat notary.json
          sub=$(plutil -extract id raw notary.json)
          status=$(plutil -extract status raw notary.json)
          if [ "$status" != Accepted ]; then
            # Apple's log names each file it refused and why.
            xcrun notarytool log "$sub" "${auth[@]}" || true
            echo "::error::Notarization: $status"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          spctl --assess --type execute -vv "target/dist/Moonglow Toolset.app"
      - name: Remove the signing keys
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*.dmg

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        # (Never marked a pre-release by its version: a fork's -channel.N
        # is a release on the fork.)
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Moonglow Toolset $GITHUB_REF_NAME" --generate-notes dist/*

[package]
name = "mg-plugin"
description = "Plugins: manifests, the sandboxed Luau runtime and the API a plugin reads and edits a module through"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
mg-2da.workspace = true
mg-core.workspace = true
mg-edit.workspace = true
mg-gff.workspace = true
mg-image.workspace = true
mg-module.workspace = true
mg-resman.workspace = true
mg-rules.workspace = true
mg-schema.workspace = true
mg-set.workspace = true
mg-tiles.workspace = true
mg-tlk.workspace = true
fastrand.workspace = true
mlua.workspace = true
regex-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true
# The network and the keychain themselves (`net`): the window's and `mg`'s.
keyring = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[features]
net = ["dep:ureq", "dep:keyring"]

[dev-dependencies]
mg-testkit.workspace = true
png.workspace = true

[lints]
workspace = true

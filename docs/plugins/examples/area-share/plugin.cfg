; Layonara API 1: a plugin that signs in to a service and sends areas to it.
[plugin]
id = "example.area-share"
name = "Area share"
version = "0.1.0"
api = "0.10"
layonara_api = "1"
license = "GPL-3.0-or-later"
description = "Signs in to areas.example.org, sends an area there as nwn_gff JSON, and fetches it back."
author = "Moonglow"

[network]
hosts = "areas.example.org"

[signin]
id = "example"
issuer = "https://auth.example.org/application/o/area-share/"
client = "area-share"
scopes = "openid profile offline_access"

[command]
id = "sign-in"
title = "Sign In"
hint = "Sign in to areas.example.org"

[command]
id = "send"
title = "Send Area"
hint = "Send the area as it is, unsaved edits included"
for = "area"

[command]
id = "fetch"
title = "Fetch Area"
hint = "Replace the area with the copy the service has"
for = "area"

[command]
id = "sign-out"
title = "Sign Out"
